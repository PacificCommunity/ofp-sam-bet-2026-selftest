name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check Make entry points without executing models
        run: python3 ci/check-make-entrypoints.py
      - name: Verify preserved assessment files
        run: python3 ci/verify-preserved-files.py
      - name: Check R readers without refitting models
        shell: bash
        run: |
          make verify
          make extract OUT="$RUNNER_TEMP/bet-saved-results"
          make prepare INPUT="$RUNNER_TEMP/bet-refit-baseline"
      - name: Check preserved inputs and results
        shell: bash
        run: |
          sha256sum -c data/SHA256SUMS
          Rscript --vanilla -e 'parse(file="reproduce/refit.R")'
          Rscript --vanilla ci/check-refit-paths.R
          make refit-plan
          Rscript report/validate.R --outputs
          python3 ci/verify-preserved-files.py
          git diff --exit-code
